# Go2W actuator mapping, hard limits, gains, and safety policy.
actuator_profiles:
  hip:
    kind: leg_joint
    gear_ratio: 1.0
    limits: &hip_limits
      position_limited: true
      min_position: -1.0472
      max_position: 1.0472
      max_velocity: 8.0
      max_acceleration: 30.0
      max_torque: 23.7
      max_kp: 120.0
      max_ki: 10.0
      max_kd: 12.0
      max_temperature: 80.0
    gains: &leg_gains
      soft: {kp: 35.0, ki: 0.0, kd: 3.0, integral_limit: 0.0}
      normal: {kp: 70.0, ki: 0.0, kd: 5.0, integral_limit: 0.0}
      stiff: {kp: 90.0, ki: 0.0, kd: 6.0, integral_limit: 0.0}
    controller: &leg_controller
      mode_transition_duration: 0.20
      max_time_step: 0.02
    safety: &actuator_safety
      command_timeout: 0.10
      feedback_timeout: 0.10
      # Feedback-only margins absorb contact/hard-stop numerical overshoot.
      # Requested commands remain clamped to the exact limits above.
      position_limit_tolerance: 0.02
      velocity_limit_tolerance: 0.25

  front_thigh:
    kind: leg_joint
    gear_ratio: 1.0
    limits:
      <<: *hip_limits
      min_position: -1.5708
      max_position: 3.4907
    gains: *leg_gains
    controller: *leg_controller
    safety: *actuator_safety

  rear_thigh:
    kind: leg_joint
    gear_ratio: 1.0
    limits:
      <<: *hip_limits
      min_position: -0.5236
      max_position: 4.5379
    gains: *leg_gains
    controller: *leg_controller
    safety: *actuator_safety

  calf:
    kind: leg_joint
    gear_ratio: 1.0
    limits:
      <<: *hip_limits
      min_position: -2.7227
      max_position: -0.83776
      max_torque: 45.43
    gains: *leg_gains
    controller: *leg_controller
    safety: *actuator_safety

  wheel:
    kind: wheel
    gear_ratio: 1.0
    limits:
      position_limited: false
      min_position: 0.0
      max_position: 0.0
      max_velocity: 6.0
      max_acceleration: 12.0
      max_torque: 15.0
      max_kp: 0.0
      max_ki: 10.0
      max_kd: 10.0
      max_temperature: 80.0
    gains:
      soft: {kp: 0.0, ki: 0.0, kd: 3.0, integral_limit: 0.0}
      normal: {kp: 0.0, ki: 0.0, kd: 5.0, integral_limit: 0.0}
      stiff: {kp: 0.0, ki: 0.0, kd: 7.0, integral_limit: 0.0}
    controller:
      mode_transition_duration: 0.15
      max_time_step: 0.02
    safety: *actuator_safety

actuators:
  - {joint_id: front_right_hip,   profile: hip,         motor_index: 0,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: front_right_thigh, profile: front_thigh, motor_index: 1,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: front_right_calf,  profile: calf,        motor_index: 2,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: front_left_hip,    profile: hip,         motor_index: 3,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: front_left_thigh,  profile: front_thigh, motor_index: 4,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: front_left_calf,   profile: calf,        motor_index: 5,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: rear_right_hip,    profile: hip,         motor_index: 6,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: rear_right_thigh,  profile: rear_thigh,  motor_index: 7,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: rear_right_calf,   profile: calf,        motor_index: 8,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: rear_left_hip,     profile: hip,         motor_index: 9,  direction: 1.0, zero_offset: 0.0}
  - {joint_id: rear_left_thigh,   profile: rear_thigh,  motor_index: 10, direction: 1.0, zero_offset: 0.0}
  - {joint_id: rear_left_calf,    profile: calf,        motor_index: 11, direction: 1.0, zero_offset: 0.0}
  - {joint_id: front_right_wheel, profile: wheel,       motor_index: 12, direction: 1.0, zero_offset: 0.0}
  - {joint_id: front_left_wheel,  profile: wheel,       motor_index: 13, direction: 1.0, zero_offset: 0.0}
  - {joint_id: rear_right_wheel,  profile: wheel,       motor_index: 14, direction: 1.0, zero_offset: 0.0}
  - {joint_id: rear_left_wheel,   profile: wheel,       motor_index: 15, direction: 1.0, zero_offset: 0.0}
